version: '3.8'

services:
  bhava-voice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhava-3-voice-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
